description: JUST Medical Devices (Tianjin) Co., Ltd. (嘉思特医疗器材（天津）股份有限公司) is a
  Chinese orthopedic medical device manufacturer based in Tianjin, China, and a portfolio company
  of Qiming Venture Partners. The company designs and produces joint replacement implants and
  orthopedic prosthetics, applying 3D printing and additive manufacturing to hip, knee, and other
  joint reconstruction systems. Its public presence at justmedical.cn is a corporate marketing
  website (built on the Faisco/fkw.com site builder); the company publishes no developer program,
  API, SDK, or machine-readable API surface. This profile is retained as a company identity record
  in the API Evangelist network rather than an API provider entry.
